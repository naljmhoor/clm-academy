# Builds CLM Academy and publishes it to GitHub Pages on every push to main.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Verify compiled Pages entry
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, existsSync } from 'node:fs';
          const html = readFileSync('dist/index.html', 'utf8');
          if (html.includes('/src/')) throw new Error('Pages must publish compiled output, not source');
          const assets = [...html.matchAll(/(?:src|href)="\.\/([^"#]+)"/g)];
          if (!assets.some(([, path]) => path.endsWith('.js'))) throw new Error('Missing compiled JavaScript');
          for (const [, path] of assets) {
            if (!existsSync(`dist/${path}`)) throw new Error(`Missing asset: ${path}`);
          }
          JS
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
